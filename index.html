<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ツール一覧</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f7f7f5;
    color: #1d1d1b;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a {
    display: block; padding: 16px 18px; border-radius: 10px;
    background: #fff; border: 1px solid #ddd; color: inherit; text-decoration: none;
  }
  a:hover { border-color: #a8322d; }
  .name { font-weight: 600; }
  .desc { font-size: 13px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>ツール一覧</h1>
  <ul>
    <li>
      <a href="./font-preview/">
        <div class="name">書体プレビュー</div>
        <div class="desc">行書体・教科書体・千社文字・江戸文字・寄席文字で文字を表示し、画像保存や印刷ができます。</div>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
