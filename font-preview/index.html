<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>書体プレビュー</title>
<style>
  :root {
    --bg: #f6f1e7;
    --ink: #1d1a16;
    --muted: #6b6257;
    --line: #d8cfbf;
    --accent: #a8322d;
    --card: #fffdf8;
    --ok: #1f6b3a;
    --warn: #8a5a00;
    --ng: #a8322d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 3px double var(--accent);
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: .1em; }
  .controls {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end;
    padding: 14px 24px;
    background: rgba(246, 241, 231, .95);
    border-bottom: 1px solid var(--line);
  }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input[type="text"] {
    font-size: 16px; padding: 8px 10px; min-width: 260px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
  }
  input[type="number"] {
    width: 90px; font-size: 16px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
  }
  .size-row { display: flex; gap: 10px; align-items: center; }
  input[type="range"] { width: 200px; accent-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button {
    border: 0; background: #fff; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  main { padding: 20px 24px 40px; display: grid; gap: 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .card-head {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  .card-head h2 { margin: 0; font-size: 16px; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .badge.local { color: var(--ok); border-color: var(--ok); }
  .badge.adobe { color: #b3000f; border-color: #b3000f; }
  .badge.missing { color: var(--ng); border-color: var(--ng); }
  .meta a { color: var(--accent); }
  .preview {
    padding: 20px 16px;
    line-height: 1.3;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .vertical .preview {
    writing-mode: vertical-rl;
    max-height: 80vh;
    white-space: pre;
  }
  .notice { padding: 16px; font-size: 14px; line-height: 1.7; color: var(--ng); }
  .notice.warn { color: var(--warn); padding: 8px 16px 0; font-size: 13px; }
  .card.is-missing .preview { display: none; }
  .card:not(.is-missing) .notice.missing { display: none; }
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 5px 12px; font-size: 13px; border-radius: 6px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 8px 16px; font-size: 14px; }
  .btn.primary:hover { opacity: .9; color: #fff; }

  @media print {
    @page { margin: 12mm; }
    body { background: #fff; }
    header, .controls, .meta, .notice { display: none !important; }
    main { padding: 0; gap: 10mm; }
    .card { border: 0; break-inside: avoid; background: #fff; }
    .card.is-missing { display: none; }
    .card-head { border: 0; padding: 0 0 2mm; }
    .card-head h2 { font-size: 10pt; color: #666; }
    .preview { overflow: visible; padding: 0; }
    .vertical .preview { max-height: none; }
    body.print-one .card:not(.print-target) { display: none; }
    body.print-one .card-head { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>書体プレビュー</h1>
</header>

<div class="controls">
  <label>表示する文字
    <input id="text" type="text" value="山川一家内堀組">
  </label>
  <label>フォントサイズ (px)
    <div class="size-row">
      <input id="sizeRange" type="range" min="12" max="300" value="72">
      <input id="sizeNum" type="number" min="8" max="1000" value="72">
    </div>
  </label>
  <label>組方向
    <div class="seg" role="group">
      <button type="button" data-dir="h" aria-pressed="true">横書き</button>
      <button type="button" data-dir="v" aria-pressed="false">縦書き</button>
    </div>
  </label>
  <button type="button" class="btn primary" id="printAll">すべて印刷</button>
</div>

<main id="list"></main>

<script>
  // 正式なフォントの候補。@font-face の local() で照合する。
  // Chrome は英語のフルネームか PostScript 名でしか照合しない (日本語名は一致しない) ため、英語名を先に書く。
  // 代替フォントは使わない。候補が 1 つも見つからない書体は「未インストール」として表示しない。
  // adobe には Adobe Fonts のフォントを書く。family は Web プロジェクトに表示される CSS 用のフォント名 (font-family)、
  // name は画面に表示するフォント名、url はそのフォントの紹介ページ。
  // Adobe Fonts が使える書体は、インストール済みフォントより優先する。
  const STYLES = [
    { id: "gyosho", name: "行書体", adobe: [{ family: "ab-kouran-gyosho", name: "AB-香蘭行書", url: "https://fonts.adobe.com/fonts/ab-kouran-gyosho" }], candidates: ["HakusyuGyosyo", "HGGyoshotai", "HGPGyoshotai", "白舟行書", "HG行書体"] },
    { id: "senja", name: "千社文字", adobe: [{ family: "vdl-kyosensya", name: "VDL 京千社", url: "https://fonts.adobe.com/fonts/vdl-kyosensya" }], candidates: ["HakusyuSenja", "白舟千社"] },
    { id: "edo", name: "江戸文字", adobe: [{ family: "ab-togetsukanteiryu", name: "AB-渡月勘亭流", url: "https://fonts.adobe.com/fonts/ab-togetsukanteiryu" }], candidates: ["HakusyuKanteiryu", "白舟勘亭流"] },
    { id: "yose", name: "寄席文字", adobe: [{ family: "ta-engeifude", name: "TA演芸筆", url: "https://fonts.adobe.com/fonts/ta-engeifude" }], candidates: ["HakusyuYose", "白舟寄席"] },
  ];

  // Adobe Fonts の Web プロジェクト ID (埋め込みコード https://use.typekit.net/<ID>.js の <ID> 部分)。
  // 日本語フォントは「使う文字だけを配信する」方式のため、JavaScript の埋め込みコードを使う。
  const ADOBE_FONTS_PROJECT_ID = "zwp6jxa";

  // 欠けている文字の判定に使う、字形が大きく異なる 2 つのシステムフォント (macOS 標準)
  const PROBE_A = '"Hiragino Mincho ProN"';
  const PROBE_B = '"Hiragino Sans"';

  const $ = (s) => document.querySelector(s);
  const list = $("#list");
  const quote = (f) => `"${f.replace(/"/g, '\\"')}"`;

  // local() で指定名のフォントを読み込めたら、その書体専用の別名で登録する
  async function tryLocal(alias, name) {
    try {
      const face = new FontFace(alias, `local(${quote(name)})`);
      await face.load();
      document.fonts.add(face);
      return true;
    } catch {
      return false;
    }
  }

  // Web フォント (Adobe Fonts) として登録済みのフォント名か。字形を実際に読み込めた場合だけ true
  async function tryWeb(name) {
    if (!adobeActive) return false;
    try {
      const faces = await document.fonts.load(`48px ${quote(name)}`, sampleText());
      return faces.length > 0;
    } catch {
      return false;
    }
  }

  async function resolveFont(s) {
    s.ready = false;
    s.url = "";
    const alias = `fp-${s.id}-${Date.now()}`;
    s.kind = "missing"; s.label = "";
    // 優先順: Adobe Fonts → インストール済みフォント
    const tries = [
      ...s.adobe.map((f) => ["web", f.family, f]),
      ...s.candidates.map((n) => ["local", n]),
    ];
    for (const [type, n, info] of tries) {
      if (type === "web" && await tryWeb(n)) {
        s.alias = n; s.kind = "adobe"; s.label = info.name; s.url = info.url;
        break;
      }
      if (type === "local" && await tryLocal(alias, n)) {
        s.alias = alias; s.kind = "local"; s.label = n;
        break;
      }
    }
    applyFont(s);
  }

  // Adobe Fonts は DOM 上の文字だけを配信するため、各フォントで現在の文字を画面外に置いて読み込ませる
  const sampler = document.createElement("div");
  sampler.setAttribute("aria-hidden", "true");
  sampler.style.cssText = "position:absolute;left:-9999px;top:0;font-size:16px;white-space:nowrap;";
  document.body.appendChild(sampler);
  const sampleText = () => $("#text").value || " ";
  function updateSampler() {
    const names = new Set(STYLES.flatMap((s) => s.adobe.map((f) => f.family)));
    sampler.innerHTML = "";
    for (const n of names) {
      const span = document.createElement("span");
      span.style.fontFamily = quote(n);
      span.textContent = sampleText();
      sampler.appendChild(span);
    }
  }

  let adobeActive = false;
  function loadAdobeFonts() {
    if (!ADOBE_FONTS_PROJECT_ID) return;
    const script = document.createElement("script");
    script.src = `https://use.typekit.net/${encodeURIComponent(ADOBE_FONTS_PROJECT_ID)}.js`;
    script.onload = () => {
      try {
        window.Typekit.load({
          async: true,
          active: () => { adobeActive = true; STYLES.forEach(resolveFont); },
          inactive: () => console.warn("Adobe Fonts を読み込めませんでした"),
        });
      } catch (e) {
        console.warn("Adobe Fonts を読み込めませんでした", e);
      }
    };
    document.head.appendChild(script);
  }

  function applyFont(s) {
    const badge = s.card.querySelector("[data-badge]");
    const fontLabel = s.card.querySelector("[data-font]");
    const preview = s.card.querySelector("[data-preview]");
    const missingNote = s.card.querySelector(".notice.missing");
    const texts = { local: "インストール済み", adobe: "Adobe Fonts", missing: "未インストール" };
    badge.className = `badge ${s.kind}`;
    badge.textContent = texts[s.kind];
    fontLabel.textContent = "";
    if (s.kind !== "missing" && s.url) {
      const a = document.createElement("a");
      a.href = s.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = s.label;
      fontLabel.appendChild(a);
    } else if (s.kind !== "missing") {
      fontLabel.textContent = s.label;
    }
    s.card.classList.toggle("is-missing", s.kind === "missing");
    s.card.querySelectorAll("[data-save],[data-print]").forEach((b) => (b.disabled = s.kind === "missing"));
    if (s.kind === "missing") {
      const tried = [...s.adobe.map((f) => f.name), ...s.candidates].join("、");
      missingNote.textContent = `正式なフォントが見つからないため表示できません (確認したフォント名: ${tried})。`;
      preview.style.fontFamily = "";
    } else {
      // 代替フォントに落ちないよう、フォールバックは指定しない
      preview.style.fontFamily = quote(s.alias);
    }
    s.ready = s.kind !== "missing";
    checkGlyphs(s);
  }

  // 指定フォントに字形がない文字は、ブラウザが勝手に別フォントで描くため検出して警告する
  function checkGlyphs(s) {
    const warn = s.card.querySelector(".notice.warn");
    warn.textContent = "";
    if (!s.ready) return;
    const chars = [...new Set([...($("#text").value || "")])].filter((c) => c.trim());
    const canvas = checkGlyphs.c || (checkGlyphs.c = document.createElement("canvas"));
    canvas.width = canvas.height = 64;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const draw = (c, fam) => {
      ctx.clearRect(0, 0, 64, 64);
      ctx.font = `48px ${quote(s.alias)}, ${fam}`;
      ctx.textBaseline = "top";
      ctx.fillText(c, 4, 4);
      return ctx.getImageData(0, 0, 64, 64).data.join(",");
    };
    const missing = chars.filter((c) => draw(c, PROBE_A) !== draw(c, PROBE_B));
    if (missing.length) {
      warn.textContent = `このフォントに含まれていない文字があります: ${missing.join(" ")} (これらは別のフォントで描かれるため正確ではありません)`;
    }
  }

  function render() {
    list.innerHTML = "";
    for (const s of STYLES) {
      const card = document.createElement("section");
      card.className = "card";
      card.innerHTML = `
        <div class="card-head">
          <h2>${s.name}</h2>
          <div class="meta">
            <span class="badge" data-badge></span>
            <span data-font></span>
            <button type="button" class="btn" data-save>画像で保存</button>
            <button type="button" class="btn" data-print>印刷</button>
          </div>
        </div>
        <div class="notice missing"></div>
        <div class="notice warn"></div>
        <div class="preview" data-preview></div>`;
      card.querySelector("[data-save]").addEventListener("click", () => saveImage(s));
      card.querySelector("[data-print]").addEventListener("click", () => printOne(card));
      s.card = card;
      list.appendChild(card);
      resolveFont(s);
    }
    update();
  }

  function update() {
    updateSampler();
    const text = $("#text").value || " ";
    const size = Math.max(8, Number($("#sizeNum").value) || 72);
    for (const s of STYLES) {
      const p = s.card.querySelector("[data-preview]");
      p.textContent = text;
      p.style.fontSize = `${size}px`;
      checkGlyphs(s);
    }
  }

  // 表示中の文字を、そのカードの書体・サイズ・組方向で PNG に描画して保存する
  async function saveImage(s) {
    if (!s.ready) return;
    const text = $("#text").value || " ";
    const size = Math.max(8, Number($("#sizeNum").value) || 72);
    const vertical = list.classList.contains("vertical");
    const font = `${size}px ${quote(s.alias)}`;
    await document.fonts.load(font, text);

    const scale = 2; // 高解像度で出力
    const pad = Math.round(size * 0.3);
    const chars = [...text];
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    ctx.font = font;
    let w, h;
    if (vertical) {
      const colW = Math.max(...chars.map((c) => ctx.measureText(c).width), size);
      w = colW + pad * 2;
      h = size * chars.length + pad * 2;
    } else {
      w = Math.ceil(ctx.measureText(text).width) + pad * 2;
      h = Math.ceil(size * 1.3) + pad * 2;
    }
    canvas.width = Math.ceil(w * scale);
    canvas.height = Math.ceil(h * scale);
    ctx.scale(scale, scale);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#1d1a16";
    ctx.font = font;
    ctx.textBaseline = "middle";
    if (vertical) {
      ctx.textAlign = "center";
      chars.forEach((c, i) => ctx.fillText(c, w / 2, pad + size * i + size / 2));
    } else {
      ctx.textAlign = "left";
      ctx.fillText(text, pad, h / 2);
    }

    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${text.slice(0, 20)}_${s.name.replace(/\s*\(.*\)/, "")}_${size}px.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, "image/png");
  }

  function printOne(card) {
    document.body.classList.add("print-one");
    card.classList.add("print-target");
    window.print();
  }
  window.addEventListener("afterprint", () => {
    document.body.classList.remove("print-one");
    document.querySelectorAll(".print-target").forEach((c) => c.classList.remove("print-target"));
  });
  $("#printAll").addEventListener("click", () => window.print());

  $("#text").addEventListener("input", update);
  $("#sizeRange").addEventListener("input", (e) => { $("#sizeNum").value = e.target.value; update(); });
  $("#sizeNum").addEventListener("input", (e) => {
    const v = Number(e.target.value);
    if (v >= 12 && v <= 300) $("#sizeRange").value = v;
    update();
  });
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    list.classList.toggle("vertical", b.dataset.dir === "v");
  }));

  // Adobe Fonts の字形が後から届いたら、欠けている文字の判定をやり直す
  document.fonts.addEventListener("loadingdone", () => STYLES.forEach((s) => s.card && checkGlyphs(s)));

  updateSampler();
  render();
  loadAdobeFonts();
</script>
</body>
</html>
