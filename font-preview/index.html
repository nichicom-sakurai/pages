<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>書体プレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&family=Klee+One:wght@600&family=Dela+Gothic+One&family=Yuji+Boku&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7;
    --ink: #1d1a16;
    --muted: #6b6257;
    --line: #d8cfbf;
    --accent: #a8322d;
    --card: #fffdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 3px double var(--accent);
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: .1em; }
  .controls {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end;
    padding: 14px 24px;
    background: rgba(246, 241, 231, .95);
    border-bottom: 1px solid var(--line);
  }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input[type="text"] {
    font-size: 16px; padding: 8px 10px; min-width: 260px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
  }
  input[type="number"] {
    width: 90px; font-size: 16px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
  }
  .size-row { display: flex; gap: 10px; align-items: center; }
  input[type="range"] { width: 200px; accent-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button {
    border: 0; background: #fff; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  main { padding: 20px 24px 40px; display: grid; gap: 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .card-head {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  .card-head h2 { margin: 0; font-size: 16px; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  .badge.local { color: #1f6b3a; border-color: #1f6b3a; }
  .badge.sub { color: #8a5a00; border-color: #c08a2a; }
  .badge.upload { color: #2346a0; border-color: #2346a0; }
  .upload-btn { font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: underline; }
  .upload-btn input { display: none; }
  .preview {
    padding: 20px 16px;
    line-height: 1.3;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .vertical .preview {
    writing-mode: vertical-rl;
    max-height: 80vh;
    white-space: pre;
  }
  footer { padding: 0 24px 32px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 5px 12px; font-size: 13px; border-radius: 6px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 8px 16px; font-size: 14px; }
  .btn.primary:hover { opacity: .9; color: #fff; }

  @media print {
    @page { margin: 12mm; }
    body { background: #fff; }
    header, .controls, footer, .meta { display: none !important; }
    main { padding: 0; gap: 10mm; }
    .card { border: 0; break-inside: avoid; background: #fff; }
    .card-head { border: 0; padding: 0 0 2mm; }
    .card-head h2 { font-size: 10pt; color: #666; }
    .preview { overflow: visible; padding: 0; }
    .vertical .preview { max-height: none; }
    body.print-one .card:not(.print-target) { display: none; }
    body.print-one .card-head { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>書体プレビュー</h1>
</header>

<div class="controls">
  <label>表示する文字
    <input id="text" type="text" value="山川一家内堀組">
  </label>
  <label>フォントサイズ (px)
    <div class="size-row">
      <input id="sizeRange" type="range" min="12" max="300" value="72">
      <input id="sizeNum" type="number" min="8" max="1000" value="72">
    </div>
  </label>
  <label>組方向
    <div class="seg" role="group">
      <button type="button" data-dir="h" aria-pressed="true">横書き</button>
      <button type="button" data-dir="v" aria-pressed="false">縦書き</button>
    </div>
  </label>
  <button type="button" class="btn primary" id="printAll">すべて印刷</button>
</div>

<main id="list"></main>

<footer>
  各書体はパソコンにインストール済みのフォントを優先して使い、見つからない場合は無料の近似フォント (Google Fonts) で代替表示します。
  正式な書体で表示したい場合は、各書体の「フォントファイルを読み込む」から .ttf / .otf / .woff ファイルを指定してください (ファイルはブラウザ内でのみ使われ、送信されません)。
</footer>

<script>
  // 各書体: ローカルに入っている可能性のある正式フォント → 代替 Google Fonts の順に試す
  const STYLES = [
    {
      id: "gyosho",
      name: "行書体",
      local: ["白舟行書", "HG行書体", "HGP行書体", "HGS行書体", "AR行書体M", "DFP行書体", "FOT-花風行書 Pro"],
      fallback: "Yuji Mai",
      weight: 400,
    },
    {
      id: "kyokasho",
      name: "信教書体 (教科書体)",
      local: ["HG教科書体", "HGP教科書体", "UD デジタル 教科書体 N-R", "UD Digi Kyokasho N-R", "YuKyokasho", "游教科書体"],
      fallback: "Klee One",
      weight: 600,
    },
    {
      id: "senja",
      name: "千社文字",
      local: ["白舟千社", "千社文字", "DF千社文字W9", "AR千社文字", "江戸文字千社"],
      fallback: "Dela Gothic One",
      weight: 400,
    },
    {
      id: "edo",
      name: "江戸文字",
      local: ["白舟勘亭流", "江戸勘亭流", "DF勘亭流", "AR勘亭流H", "HG勘亭流"],
      fallback: "Yuji Boku",
      weight: 400,
    },
    {
      id: "yose",
      name: "寄席文字",
      local: ["白舟寄席", "寄席文字", "DF寄席文字", "AR寄席文字", "橘流寄席文字"],
      fallback: "Yuji Syuku",
      weight: 400,
    },
  ];

  const $ = (s) => document.querySelector(s);
  const list = $("#list");
  const uploaded = {}; // id -> family name

  const quote = (f) => `"${f}"`;

  function detectLocal(style) {
    // document.fonts.check はローカルにないフォントでも true を返す場合があるため、幅比較で判定する
    const canvas = detectLocal.c || (detectLocal.c = document.createElement("canvas"));
    const ctx = canvas.getContext("2d");
    const sample = "山川一家内堀組永";
    const measure = (fam) => { ctx.font = `48px ${fam}`; return ctx.measureText(sample).width; };
    const baseSerif = measure("serif");
    const baseSans = measure("sans-serif");
    for (const f of style.local) {
      if (measure(`${quote(f)}, serif`) !== baseSerif || measure(`${quote(f)}, sans-serif`) !== baseSans) {
        return f;
      }
    }
    return null;
  }

  function render() {
    list.innerHTML = "";
    for (const s of STYLES) {
      const card = document.createElement("section");
      card.className = "card";
      card.innerHTML = `
        <div class="card-head">
          <h2>${s.name}</h2>
          <div class="meta">
            <span class="badge" data-badge></span>
            <span data-font></span>
            <label class="upload-btn">フォントファイルを読み込む
              <input type="file" accept=".ttf,.otf,.woff,.woff2">
            </label>
            <button type="button" class="btn" data-save>画像で保存</button>
            <button type="button" class="btn" data-print>印刷</button>
          </div>
        </div>
        <div class="preview" data-preview></div>`;
      card.querySelector("input[type=file]").addEventListener("change", (e) => loadFile(s, e.target.files[0]));
      card.querySelector("[data-save]").addEventListener("click", () => saveImage(s));
      card.querySelector("[data-print]").addEventListener("click", () => printOne(card));
      s.card = card;
      list.appendChild(card);
      updateFont(s);
    }
    update();
  }

  function updateFont(s) {
    const badge = s.card.querySelector("[data-badge]");
    const fontLabel = s.card.querySelector("[data-font]");
    const preview = s.card.querySelector("[data-preview]");
    let family, kind, label;
    if (uploaded[s.id]) {
      family = quote(uploaded[s.id].family);
      kind = "upload"; label = "読み込み済み";
      fontLabel.textContent = uploaded[s.id].file;
    } else {
      const local = detectLocal(s);
      if (local) {
        family = quote(local);
        kind = "local"; label = "インストール済み";
        fontLabel.textContent = local;
      } else {
        family = quote(s.fallback);
        kind = "sub"; label = "代替フォント";
        fontLabel.textContent = s.fallback;
      }
    }
    badge.className = `badge ${kind}`;
    badge.textContent = label;
    preview.style.fontFamily = `${family}, serif`;
    preview.style.fontWeight = kind === "sub" ? s.weight : "normal";
  }

  async function loadFile(s, file) {
    if (!file) return;
    const family = `upload-${s.id}-${Date.now()}`;
    try {
      const face = new FontFace(family, await file.arrayBuffer());
      await face.load();
      document.fonts.add(face);
      uploaded[s.id] = { family, file: file.name };
      updateFont(s);
    } catch (err) {
      alert(`フォントを読み込めませんでした: ${file.name}`);
    }
  }

  function update() {
    const text = $("#text").value || " ";
    const size = Math.max(8, Number($("#sizeNum").value) || 72);
    for (const s of STYLES) {
      const p = s.card.querySelector("[data-preview]");
      p.textContent = text;
      p.style.fontSize = `${size}px`;
    }
  }

  // 表示中の文字を、そのカードの書体・サイズ・組方向で PNG に描画して保存する
  async function saveImage(s) {
    const preview = s.card.querySelector("[data-preview]");
    const text = $("#text").value || " ";
    const size = Math.max(8, Number($("#sizeNum").value) || 72);
    const vertical = list.classList.contains("vertical");
    const cs = getComputedStyle(preview);
    const font = `${cs.fontWeight} ${size}px ${cs.fontFamily}`;
    await document.fonts.load(font, text);

    const scale = 2; // 高解像度で出力
    const pad = Math.round(size * 0.3);
    const chars = [...text];
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    ctx.font = font;
    let w, h;
    if (vertical) {
      const colW = Math.max(...chars.map((c) => ctx.measureText(c).width), size);
      w = colW + pad * 2;
      h = size * chars.length + pad * 2;
    } else {
      w = Math.ceil(ctx.measureText(text).width) + pad * 2;
      h = Math.ceil(size * 1.3) + pad * 2;
    }
    canvas.width = Math.ceil(w * scale);
    canvas.height = Math.ceil(h * scale);
    ctx.scale(scale, scale);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#1d1a16";
    ctx.font = font;
    ctx.textBaseline = "middle";
    if (vertical) {
      ctx.textAlign = "center";
      chars.forEach((c, i) => ctx.fillText(c, w / 2, pad + size * i + size / 2));
    } else {
      ctx.textAlign = "left";
      ctx.fillText(text, pad, h / 2);
    }

    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${text.slice(0, 20)}_${s.name.replace(/\s*\(.*\)/, "")}_${size}px.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, "image/png");
  }

  function printOne(card) {
    document.body.classList.add("print-one");
    card.classList.add("print-target");
    window.print();
  }
  window.addEventListener("afterprint", () => {
    document.body.classList.remove("print-one");
    document.querySelectorAll(".print-target").forEach((c) => c.classList.remove("print-target"));
  });
  $("#printAll").addEventListener("click", () => window.print());

  $("#text").addEventListener("input", update);
  $("#sizeRange").addEventListener("input", (e) => { $("#sizeNum").value = e.target.value; update(); });
  $("#sizeNum").addEventListener("input", (e) => {
    const v = Number(e.target.value);
    if (v >= 12 && v <= 300) $("#sizeRange").value = v;
    update();
  });
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    list.classList.toggle("vertical", b.dataset.dir === "v");
  }));

  render();
  // Web フォント読み込み後に再判定 (ローカル判定は Web フォントの影響を受けない)
  document.fonts.ready.then(() => STYLES.forEach(updateFont));
</script>
</body>
</html>
